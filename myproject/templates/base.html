{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Доска объявлений{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Кастомный CSS -->
    <link rel="stylesheet" href="{% static 'myapp/css/styles.css' %}">

    <style>
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen">

<header class="bg-gray-800 shadow-lg mb-10 fade-in">
    <div class="max-w-6xl mx-auto flex justify-between items-center py-4 px-4">
        <h1 class="text-2xl font-bold">Доска объявлений MMORPG</h1>
        <nav>
            {% if user.is_authenticated %}
                <span class="mr-4">Привет, <b>{{ user.username }}</b></span>
                <a href="{% url 'logout' %}" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-white btn-main">Выйти</a>
            {% else %}
                <a href="{% url 'login' %}" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded btn-main">Войти</a>
            {% endif %}
        </nav>
    </div>
</header>

<main class="max-w-6xl mx-auto px-4">
    {% block content %}{% endblock %}
</main>
<style>
  .ck-editor__editable_inline {
      background-color: white !important;
      color: black !important;
      min-height: 200px;
}
</style>
</body>
</html>
